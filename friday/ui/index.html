<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пятница</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="state-loading">
<div id="bg-layer">
  <div class="circles-anchor">
    <div class="circle c4"></div>
    <div class="circle c3"></div>
    <div class="circle c2"></div>
    <div class="circle c1"></div>
  </div>
</div>
<div id="app">
  <header>
    <div class="drag-strip pywebview-drag-region"></div>
    <h1>Пятница</h1>
    <span id="status">Загружаюсь…</span>
    <div class="window-buttons">
      <button id="btn-minimize" type="button" aria-label="Свернуть">&#8211;</button>
      <button id="btn-close" type="button" aria-label="Закрыть">&#10005;</button>
    </div>
  </header>
  <div id="chat"></div>
  <form id="composer" autocomplete="off">
    <input id="text-input" type="text" maxlength="500" placeholder="Напишите сообщение…" autocomplete="off">
    <button id="send" type="submit" aria-label="Отправить">↑</button>
  </form>
</div>
<div class="resize-handle" id="resize-right" data-resize="x"></div>
<div class="resize-handle" id="resize-bottom" data-resize="y"></div>
<div class="resize-handle" id="resize-corner" data-resize="xy"></div>
<script src="app.js"></script>
</body>
</html>
