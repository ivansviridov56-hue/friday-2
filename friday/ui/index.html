<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пятница</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="themes/windows.css">
<link rel="stylesheet" href="themes/black.css">
</head>
<body class="state-loading">
<div id="bg-layer">
  <div class="circles-anchor">
    <div class="circle c4"></div>
    <div class="circle c3"></div>
    <div class="circle c2"></div>
    <div class="circle c1"></div>
  </div>
  <div id="circles-custom"></div>
</div>
<div id="app">
  <header>
    <div class="drag-strip pywebview-drag-region"></div>
    <h1>Пятница</h1>
    <span id="status">Загружаюсь…</span>
    <div class="window-buttons">
      <button id="btn-settings" type="button" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button id="btn-minimize" type="button" aria-label="Свернуть">&#8211;</button>
      <button id="btn-close" type="button" aria-label="Закрыть">&#10005;</button>
    </div>
  </header>
  <div id="chat"></div>
  <div id="dock">
    <form id="composer" autocomplete="off">
      <textarea id="text-input" rows="1" maxlength="500" placeholder="Напишите сообщение…" autocomplete="off" spellcheck="false"></textarea>
      <button id="send" type="submit" aria-label="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
    <div id="music-orb" class="hidden" aria-hidden="true">
      <img id="music-cover" alt="">
    </div>
  </div>
  <aside id="settings" class="closed" aria-hidden="true">
    <div class="settings-head">
      <h2>Настройки</h2>
      <button id="settings-close" type="button" aria-label="Закрыть">&#10005;</button>
    </div>
    <section>
      <h3>Тема</h3>
      <div class="options" id="opt-theme"></div>
    </section>
    <section>
      <h3>Вид кругов</h3>
      <div class="options" id="opt-circles"></div>
    </section>
  </aside>
</div>
<div class="resize-handle" id="resize-right" data-resize="x"></div>
<div class="resize-handle" id="resize-bottom" data-resize="y"></div>
<div class="resize-handle" id="resize-corner" data-resize="xy"></div>
<script src="circles/core.js"></script>
<script src="circles/blobs.js"></script>
<script src="circles/equalizer.js"></script>
<script src="circles/dots.js"></script>
<script src="app.js"></script>
</body>
</html>
